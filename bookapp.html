<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Doctor's Appointment</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="pdf-export.js"></script>
</head>
<body class="appointment-page">

<div class="appointment-container">
    <h2>Book an Appointment</h2>
    <form action="#" method="post">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>
        </div>
        <div class="form-group">
            <label for="doctor">Select a Doctor</label>
            <select id="doctor" name="doctor" required>
                <option value="" disabled selected>Select a doctor...</option>
                <option value="Dr. Emily Carter ">Dr. Emily Carter - Cardiology</option>
                <option value="Dr. Michael Johnson">Dr. Mark Johnson - Orthopedics</option>
                <option value="Dr. Sarah Wilson">Dr. Sarah Wilson - Pediatrics</option>
                <option value="Dr. Robert Brown">Dr. Robert Brown - Neurology</option>
                <option value="Dr. Lisa Davis">Dr. Lisa Davis - Dermatology</option>
            </select>
        </div>
        <div class="form-group">
            <label for="date " >Preferred Date</label>
            <input type="date" id="date" name="date" required>
        </div>
        <div class="form-group">
            <label for="time">Preferred Time</label>
            <input type="time" id="time" name="time" required>
        </div>
        <div class="form-group">
            <label for="reason">Reason for Visit</label>
            <textarea id="reason" name="reason" class="reason-for-visit" rows="4" required></textarea>
        </div>
        <button type="submit" class="submit-button">Request Appointment</button>
    </form>
</div>

</body>
</html>
