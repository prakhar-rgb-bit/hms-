<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>
<body class="login-page">

<div class="background-image"></div>

<div class="login-container">
    <div class="logo">
        <img src="https://media.istockphoto.com/id/1815039685/vector/caduceus-medical-symbol-sign-stock-vector.jpg?s=612x612&w=0&k=20&c=V7ulOLsszq0oZt0m4IhgQN1XrHIHhT_9FB9WO2LdisA=" alt="Hospital Logo">
    </div>
    <h2>Hospital Management System</h2>
    
    <form id="loginForm">
        <div class="user-type-selector">
            <select id="userType" onchange="updateLoginForm()">
                <option value="doctor">Doctor Login</option>
                <option value="patient">Patient Login</option>
                <option value="staff">Staff Login</option>
            </select>
        </div>
        
        <div class="input-group">
            <label for="username" id="usernameLabel">Doctor ID</label>
            <input type="text" id="username" placeholder="Enter Doctor ID" required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <div class="forgot-password">
            <a href="fppage.html">Forgot Password?</a>
        </div>
        <button type="submit" class="login-button">Log In</button>
        <p id="output" style="color: red; margin-top: 10px;"></p>
        
        <a href="bookapp.html" class="redirect-button">Book Appointment</a>
    </form>
</div>

<script>
const users = {
    doctor: {
        "DOC001": { password: "password123", name: "Dr. Emily Carter", specialty: "Cardiology", profilePicture: "https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=150&h=150&fit=crop&crop=face" },
        "DOC002": { password: "securepass456", name: "Dr. Michael Johnson", specialty: "Orthopedics", profilePicture: "https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?w=150&h=150&fit=crop&crop=face" },
        "DOC003": { password: "mypass789", name: "Dr. Sarah Wilson", specialty: "Pediatrics", profilePicture: "https://images.unsplash.com/photo-1594824475317-29bb4c8b7b7e?w=150&h=150&fit=crop&crop=face" },
        "DOC004": { password: "docpass321", name: "Dr. Robert Brown", specialty: "Neurology", profilePicture: "https://images.unsplash.com/photo-1582750433449-648ed127bb54?w=150&h=150&fit=crop&crop=face" },
        "DOC005": { password: "medpass654", name: "Dr. Lisa Davis", specialty: "Dermatology", profilePicture: "https://images.unsplash.com/photo-1527613426441-4da17471b66d?w=150&h=150&fit=crop&crop=face" }
    },
    patient: {
        "PAT001": { password: "patient123", name: "John Smith", dob: "1985-05-15", profilePicture: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&h=150&fit=crop&crop=face" },
        "PAT002": { password: "patient456", name: "Mary Johnson", dob: "1990-08-22", profilePicture: "https://images.unsplash.com/photo-1494790108755-2616b612b786?w=150&h=150&fit=crop&crop=face" },
        "PAT003": { password: "patient789", name: "Robert Davis", dob: "1978-12-10", profilePicture: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=150&h=150&fit=crop&crop=face" },
        "PAT004": { password: "patient321", name: "Jennifer Wilson", dob: "1992-03-28", profilePicture: "https://images.unsplash.com/photo-1494790108755-2616b612b786?w=150&h=150&fit=crop&crop=face" },
        "PAT005": { password: "patient654", name: "Michael Brown", dob: "1987-11-05", profilePicture: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&h=150&fit=crop&crop=face" }
    },
    staff: {
        "STF001": { password: "staff123", name: "Alice Wilson", role: "Nurse", profilePicture: "https://images.unsplash.com/photo-1559757148-5c350d0d3c56?w=150&h=150&fit=crop&crop=face" },
        "STF002": { password: "staff456", name: "Bob Anderson", role: "Receptionist", profilePicture: "https://images.unsplash.com/photo-1560250097-0b93528c311a?w=150&h=150&fit=crop&crop=face" },
        "STF003": { password: "staff789", name: "Carol Martinez", role: "Lab Technician", profilePicture: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=150&h=150&fit=crop&crop=face" },
        "STF004": { password: "staff321", name: "David Thompson", role: "Pharmacist", profilePicture: "https://images.unsplash.com/photo-1560250097-0b93528c311a?w=150&h=150&fit=crop&crop=face" },
        "STF005": { password: "staff654", name: "Emma Rodriguez", role: "Administrative Assistant", profilePicture: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=150&h=150&fit=crop&crop=face" }
    }
};

function updateLoginForm() {
    const userType = document.getElementById('userType').value;
    const usernameLabel = document.getElementById('usernameLabel');
    const usernameInput = document.getElementById('username');
    
    switch(userType) {
        case 'doctor':
            usernameLabel.textContent = 'Doctor ID';
            usernameInput.placeholder = 'Enter Doctor ID';
            break;
        case 'patient':
            usernameLabel.textContent = 'Patient ID';
            usernameInput.placeholder = 'Enter Patient ID';
            break;
        case 'staff':
            usernameLabel.textContent = 'Staff ID';
            usernameInput.placeholder = 'Enter Staff ID';
            break;
    }
}

document.getElementById('loginForm').onsubmit = function(e) {
    e.preventDefault();
    const userType = document.getElementById('userType').value;
    const id = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const output = document.getElementById('output');
    
    if (users[userType][id] && users[userType][id].password === pass) {
        const userData = {...users[userType][id], userId: id};
        localStorage.setItem('currentUser', JSON.stringify(userData));
        localStorage.setItem('userType', userType);
        localStorage.setItem('userId', id);
        output.style.color = 'green';
        output.textContent = 'Login successful!';
        
        setTimeout(() => {
            if (userType === 'doctor') {
                localStorage.setItem('currentDoctor', JSON.stringify(userData));
                window.location.href = 'Doctor/homepage.html';
            } else if (userType === 'patient') {
                window.location.href = 'Patient/homepat.html';
            } else if (userType === 'staff') {
                localStorage.setItem('currentStaff', JSON.stringify(userData));
                window.location.href = 'Staff/homestaff.html';
            }
        }, 1000);
    } else {
        output.textContent = 'Invalid credentials!';
    }
};
</script>
</body>
</html>
