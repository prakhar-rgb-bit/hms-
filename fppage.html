<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>


    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="forgot-password-page">

<div class="forgot-password-container">
    <img src="https://media.istockphoto.com/id/1815039685/vector/caduceus-medical-symbol-sign-stock-vector.jpg?s=612x612&w=0&k=20&c=V7ulOLsszq0oZt0m4IhgQN1XrHIHhT_9FB9WO2LdisA=" alt="Company Logo" class="logo"> <h2>Forgot Password</h2>
    <p>Enter your email address and we'll send you a link to reset your password.</p>
    <form id="forgot-password-form" onsubmit="showConfirmation(event)">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
        </div>
        <button type="submit" class="reset-button">Send Reset Link</button>
    </form>
    <div id="confirmation-message">Link Sent!</div>
    <div class="back-to-login">
        <a href="login.html">Back to Login</a>
    </div>
</div>

<script>
    function showConfirmation(event) {
        event.preventDefault();
        const form = document.getElementById('forgot-password-form');
        const confirmationMessage = document.getElementById('confirmation-message');
        
        form.style.display = 'none';
        confirmationMessage.style.display = 'block';

        // In a real application, you would also send the data to a server here.
        // const email = document.getElementById('email').value;
        // fetch('/api/forgot-password', {
        //     method: 'POST',
        //     headers: { 'Content-Type': 'application/json' },
        //     body: JSON.stringify({ email: email })
        // });
    }
</script>

</body>
</html>
