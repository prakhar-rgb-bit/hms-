<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor's Dashboard - Hospital Management System</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="../pdf-export.js"></script>
</head>
<body>

<div class="header doctor">
    <h1>Doctor's Dashboard</h1>
    <div class="user-info">
        <span id="doctorName">Dr. Emily Carter</span>
        <div class="profile-pic doctor" id="profilePic" onclick="changeProfilePic()">
            <img id="profileImage" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUvhb-qkFEMVw9sKXnJ5eos4WwwmhYNdT_2w&s" alt="Profile Picture">
            <div class="profile-overlay">📷</div>
        </div>
        <input type="file" id="profileUpload" accept="image/*" style="display: none;" onchange="handleProfileUpload(event)">
    </div>
</div>

<div class="container">
    <div class="sidebar">
        <a href="homepage.html" class="active"><i class="fas fa-home"></i> Home</a>
        <a href="app.html"><i class="fas fa-calendar-check"></i> Appointments</a>
        <a href="../Patient/patient.html"><i class="fas fa-users"></i> Patients</a>
        <a href="reports.html"><i class="fas fa-chart-line"></i> Reports</a>
        <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
        <a href="../login.html" onclick="localStorage.clear()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>

    <div class="main-content">
        <div class="dashboard-grid">
            <div class="card appointments">
                <h3><i class="fas fa-calendar-alt"></i> Today's Appointments</h3>
                <ul class="appointments-list" id="appointmentsList">
                    <!-- Appointments will be loaded dynamically -->
                </ul>
            </div>

            <div class="card stats">
                <h3><i class="fas fa-chart-bar"></i> Key Statistics</h3>
                <ul class="appointments-list">
                    <li>
                        <div class="appointment-info">
                            <strong>Total Appointments</strong>
                        </div>
                        <strong>25</strong>
                    </li>
                    <li>
                        <div class="appointment-info">
                            <strong>Pending Appointments</strong>
                        </div>
                        <strong>5</strong>
                    </li>
                    <li>
                        <div class="appointment-info">
                            <strong>New Patients This Week</strong>
                        </div>
                        <strong>8</strong>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script>
const appointmentsBySpecialty = {
    "Cardiology": [
        { patient: "John Smith", time: "09:00 AM", status: "upcoming" },
        { patient: "Mary Johnson", time: "11:00 AM", status: "completed" },
        { patient: "Robert Davis", time: "02:00 PM", status: "urgent" }
    ],
    "Orthopedics": [
        { patient: "Mike Wilson", time: "10:30 AM", status: "upcoming" },
        { patient: "Sarah Brown", time: "01:30 PM", status: "completed" }
    ],
    "Pediatrics": [
        { patient: "Tommy Lee", time: "08:30 AM", status: "completed" },
        { patient: "Emma White", time: "12:00 PM", status: "upcoming" },
        { patient: "Jack Miller", time: "03:30 PM", status: "urgent" }
    ],
    "Neurology": [
        { patient: "David Clark", time: "09:30 AM", status: "upcoming" },
        { patient: "Lisa Garcia", time: "02:30 PM", status: "completed" }
    ],
    "Dermatology": [
        { patient: "Anna Martinez", time: "10:00 AM", status: "completed" },
        { patient: "Chris Taylor", time: "01:00 PM", status: "upcoming" },
        { patient: "Nina Anderson", time: "04:00 PM", status: "urgent" }
    ]
};

function changeProfilePic() {
    document.getElementById('profileUpload').click();
}

function handleProfileUpload(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const profileImage = document.getElementById('profileImage');
            profileImage.src = e.target.result;
            
            // Save to localStorage with user ID
            const doctor = JSON.parse(localStorage.getItem('currentDoctor')) || {};
            const userId = doctor.userId || localStorage.getItem('userId');
            doctor.profilePicture = e.target.result;
            localStorage.setItem('currentDoctor', JSON.stringify(doctor));
            localStorage.setItem(`profilePic_${userId}`, e.target.result);
        };
        reader.readAsDataURL(file);
    }
}

window.onload = function() {
    const doctor = JSON.parse(localStorage.getItem('currentDoctor'));
    if (doctor) {
        document.getElementById('doctorName').textContent = doctor.name;
        
        // Load user-specific profile picture
        const profileImage = document.getElementById('profileImage');
        const userId = doctor.userId || localStorage.getItem('userId');
        const savedProfilePic = localStorage.getItem(`profilePic_${userId}`);
        
        if (savedProfilePic) {
            profileImage.src = savedProfilePic;
        } else if (doctor.profilePicture) {
            profileImage.src = doctor.profilePicture;
        }
        
        const appointments = appointmentsBySpecialty[doctor.specialty] || [];
        const appointmentsList = document.getElementById('appointmentsList');
        
        appointments.forEach(apt => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="appointment-info">
                    <strong>${apt.patient}</strong>
                    <span>${apt.time} | ${doctor.specialty}</span>
                </div>
                <span class="badge badge-${apt.status}">${apt.status.charAt(0).toUpperCase() + apt.status.slice(1)}</span>
            `;
            appointmentsList.appendChild(li);
        });
    }
};
</script>
</body>
</html>
